# Copy to config.yaml and fill in your details.

subject:
  full_name: "Your Full Name"
  email: "your.email@example.com"
  phone: "+1 555 0100"
  address_line1: "Your street address"
  city: "Your city"
  region: ""              # state/province — optional
  postcode: "12345"
  country: "Your country"

# Privacy law settings for your jurisdiction (edit for your country)
jurisdiction:
  privacy_law: "applicable data protection law"   # e.g. GDPR, CCPA, LGPD
  erasure_article: "Article 17"
  regulator_name: "your data protection authority"
  regulator_url: "https://example.com/file-a-complaint"
  response_days: 30
  google_delisting_region: "Your country"

preferences:
  no_police: true
  closing_platform_after_removal: false

case:
  summary: >
    False and damaging content was posted about me on a social platform
    alongside my photograph without consent. I deny all allegations and am
    seeking removal under applicable privacy and platform policies.

  facebook:
    group_name: "Example Community Group"
    post_date: "2025-06-05"
    post_caption: "Example caption text"
    post_url: "https://www.facebook.com/groups/EXAMPLE/posts/EXAMPLE/"
    post_origin: uncertain    # uncertain | third_party | self
    reported_to_meta: true
    meta_report_reference: ""
    meta_reports:
      - type: "In-app content report"
        date: "2026-01-01"
        outcome: "Rejected — content does not violate Community Standards"
        notes: "Attach screenshot of platform support message"
    group_pattern: >
      The group publishes individuals' photos soliciting unverified allegations.
      My request is for erasure of MY data only.

  alleged_commenters:
    - display_name: "ExampleUser1"
      comment: "Example harmful comment"
      posted_approx: "date unknown"

evidence:
  screenshots_dir: "./evidence/screenshots"
  output_dir: "./output"

monitor:
  search_queries:
    - '"Your Full Name"'
    - '"Your Full Name" Facebook'
  region: "en"

automation:
  enabled: true
  auto_start_campaign: true
  auto_escalate: true
  meta_escalation_days: 7
  auto_send_emails: false
  slack_webhook_url: ""
  smtp:
    enabled: false
    host: "smtp.gmail.com"
    port: 587
    use_tls: true
    username: "your.email@gmail.com"
    password: ""
    from_email: "your.email@gmail.com"
  image_search:
    provider: "none"
    serpapi_key: ""
    tineye_api_key: ""
    reference_image: ""

campaign:
  meta_reminder_days: 7
  regulator_trigger_after_meta_round: 4
